<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" /> <!-- Copper / Terracotta -->
      <stop offset="100%" stop-color="#E2A869" /> <!-- Amber -->
    </linearGradient>
  </defs>
  
  <!-- Outer Energy Rings -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#warmGradient)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#warmGradient)" stroke-width="1" opacity="0.8"/>
  
  <!-- Core Sun/Infrared Element -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Minimalist Geometric Rays -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="12" x2="50" y2="20" />
    <line x1="50" y1="80" x2="50" y2="88" />
    <line x1="12" y1="50" x2="20" y2="50" />
    <line x1="80" y1="50" x2="88" y2="50" />
    
    <line x1="23.1" y1="23.1" x2="28.8" y2="28.8" />
    <line x1="71.2" y1="71.2" x2="76.9" y2="76.9" />
    <line x1="23.1" y1="76.9" x2="28.8" y2="71.2" />
    <line x1="71.2" y1="28.8" x2="76.9" y2="23.1" />
  </g>

  <!-- Central Glow / Inner Circle -->
  <circle cx="50" cy="50" r="10" fill="url(#warmGradient)"/>
</svg>
